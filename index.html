<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma Ágil — Pendientes Oscar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- ============================================================
  INSTRUCCIONES — LEA ANTES DE SUBIR A GITHUB
  ============================================================
  1. Vaya a console.firebase.google.com
  2. Abra su proyecto → Configuración ⚙️ → Aplicaciones → su app web
  3. Copie los valores de firebaseConfig y péguelos abajo
     reemplazando cada "PEGAR_AQUI_..." con su valor real.
  4. Guarde el archivo y súbalo a GitHub.
  ============================================================ -->

<script type="module">
  import { initializeApp }          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, update, remove }
                                    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ── PEGUE AQUÍ SUS CLAVES DE FIREBASE ──────────────────────
  const firebaseConfig = {
    apiKey:            "AIzaSyD73rC4QPv_I8RtLMx1mfmT991gnTOHS7c",
    authDomain:        "cronograma-actividades-3febf.firebaseapp.com",
    databaseURL:       "https://cronograma-actividades-3febf-default-rtdb.firebaseio.com",
    projectId:         "cronograma-actividades-3febf",
    storageBucket:     "cronograma-actividades-3febf.firebasestorage.app",
    messagingSenderId: "77108164236",
    appId:             "1:77108164236:web:3b9f9b42c0897691a96da9"
  };
  // ───────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const TASKS_REF = ref(db, 'tasks');

  // ── Datos iniciales (se cargan solo la primera vez) ────────
  const INITIAL_TASKS = [
    {id:0,  text:"Distribución automática enlace (reemplazo Juanito)",              proj:0, week:0, prio:"alta",  start:"2026-05-12", end:"2026-05-12", done:false},
    {id:1,  text:"Solicitud Hildebrando – IRP",                                     proj:4, week:0, prio:"alta",  start:"2026-05-12", end:"2026-05-13", done:false},
    {id:2,  text:"Solicitud Hildebrando – velocidades entre paradas",               proj:4, week:0, prio:"alta",  start:"2026-05-12", end:"2026-05-13", done:false},
    {id:3,  text:"Hablar con Sebastián – casos debido proceso",                     proj:6, week:0, prio:"media", start:"2026-05-14", end:"2026-05-14", done:false},
    {id:4,  text:"Implementar cálculo de fonias – nueva metodología",               proj:1, week:1, prio:"alta",  start:"2026-05-19", end:"2026-05-21", done:false},
    {id:5,  text:"Fonias Juan Sebastián Rocha",                                     proj:1, week:1, prio:"media", start:"2026-05-19", end:"2026-05-22", done:false},
    {id:6,  text:"Revisar tablero fonias enviado a Masivo Capital",                 proj:1, week:1, prio:"alta",  start:"2026-05-20", end:"2026-05-21", done:false},
    {id:7,  text:"Ajustar tablero fonias al formato Masivo Capital",                proj:1, week:1, prio:"alta",  start:"2026-05-22", end:"2026-05-23", done:false},
    {id:8,  text:"Comportamental – actualizar",                                     proj:2, week:2, prio:"alta",  start:"2026-05-26", end:"2026-05-27", done:false},
    {id:9,  text:"Buscar retrasos",                                                 proj:2, week:2, prio:"media", start:"2026-05-26", end:"2026-05-27", done:false},
    {id:10, text:"Unificar comportamental y retrasos",                              proj:2, week:2, prio:"media", start:"2026-05-28", end:"2026-05-29", done:false},
    {id:11, text:"Actualizar tablero técnicos y misionales",                        proj:3, week:2, prio:"alta",  start:"2026-05-26", end:"2026-05-28", done:false},
    {id:12, text:"Ajuste macro y validación tablero Power BI",                      proj:3, week:3, prio:"alta",  start:"2026-06-02", end:"2026-06-04", done:false},
    {id:13, text:"Validar respaldo eliminaciones (notas / varados / Sirci / tickets)", proj:3, week:3, prio:"media", start:"2026-06-03", end:"2026-06-05", done:false},
    {id:14, text:"Indicadores semanales + informe operativo",                       proj:3, week:3, prio:"alta",  start:"2026-06-02", end:"2026-06-06", done:false},
    {id:15, text:"Datos históricos nov 2025 – abr 2026 (requiere ingresos)",        proj:4, week:3, prio:"media", start:"2026-06-04", end:"2026-06-06", done:false},
    {id:16, text:"Ajustes tiempos de ciclo",                                        proj:4, week:4, prio:"baja",  start:"2026-06-09", end:"2026-06-11", done:false},
    {id:17, text:"Nuevo formato Valeria → trasladar a zonal",                       proj:5, week:4, prio:"media", start:"2026-06-09", end:"2026-06-11", done:false},
    {id:18, text:"Herramientas equipo post (hoja ruta, lenguaje, sesiones, flujograma jurídico)", proj:5, week:4, prio:"baja", start:"2026-06-10", end:"2026-06-13", done:false},
    {id:19, text:"Fonias – transcribir (eliminación vs notas)",                     proj:1, week:4, prio:"baja",  start:"2026-06-12", end:"2026-06-13", done:false},
  ];

  let tasks   = [];
  let nextId  = 20;
  let saving  = false;
  const openWeeks = new Set([0,1,2,3,4]);

  // ── Escuchar cambios en tiempo real ───────────────────────
  onValue(TASKS_REF, snapshot => {
    const data = snapshot.val();
    if (data) {
      tasks  = Object.values(data).sort((a,b) => a.id - b.id);
      nextId = Math.max(...tasks.map(t => t.id)) + 1;
    } else {
      // Primera vez: guardar datos iniciales
      tasks = INITIAL_TASKS;
      saveAll(true);
    }
    render();
    updateStats();
    showStatus('sincronizado');
  });

  // ── Guardar todo en Firebase ──────────────────────────────
  function saveAll(silent = false) {
    if (!silent) showStatus('guardando');
    const obj = {};
    tasks.forEach(t => { obj['t' + t.id] = t; });
    set(TASKS_REF, obj)
      .then(() => { if (!silent) showStatus('guardado'); })
      .catch(() => showStatus('error'));
  }

  // ── Guardar una tarea individual ──────────────────────────
  function saveTask(t) {
    showStatus('guardando');
    update(ref(db, 'tasks/t' + t.id), t)
      .then(() => showStatus('guardado'))
      .catch(() => showStatus('error'));
  }

  function deleteTask(id) {
    showStatus('guardando');
    remove(ref(db, 'tasks/t' + id))
      .then(() => showStatus('guardado'))
      .catch(() => showStatus('error'));
  }

  function showStatus(state) {
    const el = document.getElementById('save-status');
    if (!el) return;
    const states = {
      guardando:   { icon:'fa-spinner fa-spin', text:'Guardando…',          color:'#EF9F27' },
      guardado:    { icon:'fa-cloud-arrow-up',  text:'Guardado en la nube', color:'#1D9E75' },
      sincronizado:{ icon:'fa-rotate',          text:'En tiempo real',      color:'#378ADD' },
      error:       { icon:'fa-triangle-exclamation', text:'Error al guardar', color:'#E24B4A' },
    };
    const s = states[state] || states.sincronizado;
    el.innerHTML = `<i class="fa-solid ${s.icon}" style="color:${s.color}"></i> <span style="color:${s.color}">${s.text}</span>`;
  }

  // ── Acciones ──────────────────────────────────────────────
  window.toggleDone = id => {
    const t = tasks.find(x => x.id === id);
    if (t) { t.done = !t.done; saveTask(t); render(); updateStats(); }
  };
  window.setPrio = (id, v) => {
    const t = tasks.find(x => x.id === id);
    if (t) { t.prio = v; saveTask(t); render(); updateStats(); }
  };
  window.setDate = (id, f, v) => {
    const t = tasks.find(x => x.id === id);
    if (t) { t[f] = v; saveTask(t); updateStats(); }
  };
  window.delTask = id => {
    if (!confirm('¿Eliminar esta actividad?')) return;
    tasks = tasks.filter(x => x.id !== id);
    deleteTask(id);
    render(); updateStats();
  };
  window.addTask = (wi, text, pi) => {
    if (!text.trim()) return;
    const w = WK[wi];
    const t = { id: nextId++, text: text.trim(), proj: +pi, week: wi, prio: 'media', start: w.ws, end: w.we, done: false };
    tasks.push(t);
    saveTask(t);
    render(); updateStats();
  };
  window.toggleWeek = wi => {
    if (openWeeks.has(wi)) openWeeks.delete(wi); else openWeeks.add(wi);
    const body = document.getElementById('wb-' + wi);
    const chev = document.getElementById('wc-' + wi);
    if (body) body.classList.toggle('open', openWeeks.has(wi));
    if (chev) chev.classList.toggle('open', openWeeks.has(wi));
  };
  window.saveAllManual = () => saveAll(false);

  // ── Constantes de UI ──────────────────────────────────────
  const PM = [
    {name:"Distribución",        dot:"#1D9E75", bg:"#E1F5EE", tx:"#0F6E56"},
    {name:"Fonias",              dot:"#7F77DD", bg:"#EEEDFE", tx:"#3C3489"},
    {name:"Comportamental",      dot:"#BA7517", bg:"#FAEEDA", tx:"#633806"},
    {name:"Tableros Power BI",   dot:"#378ADD", bg:"#E6F1FB", tx:"#0C447C"},
    {name:"Datos / Hildebrando", dot:"#639922", bg:"#EAF3DE", tx:"#27500A"},
    {name:"Post / Zonal",        dot:"#D85A30", bg:"#FAECE7", tx:"#712B13"},
    {name:"Gestión",             dot:"#888780", bg:"#F1EFE8", tx:"#444441"},
  ];
  window.WK = [
    {label:"Semana 1", dates:"12–16 mayo 2026",  focus:"Quick wins y gestión inicial",  ws:"2026-05-12", we:"2026-05-16"},
    {label:"Semana 2", dates:"19–23 mayo 2026",  focus:"Módulo Fonias",                 ws:"2026-05-19", we:"2026-05-23"},
    {label:"Semana 3", dates:"26–30 mayo 2026",  focus:"Comportamental y tableros",     ws:"2026-05-26", we:"2026-05-30"},
    {label:"Semana 4", dates:"2–6 junio 2026",   focus:"Indicadores e histórico",       ws:"2026-06-02", we:"2026-06-06"},
    {label:"Semana 5", dates:"9–13 junio 2026",  focus:"Cierre y herramientas post",    ws:"2026-06-09", we:"2026-06-13"},
  ];

  function pcls(v)  { return v==='alta'?'p-alta':v==='media'?'p-media':'p-baja'; }
  function projBadge(pi) {
    const p = PM[pi];
    return `<span class="proj-badge" style="background:${p.bg};color:${p.tx};border-color:${p.tx}55">
      <span class="pd" style="background:${p.dot}"></span>${p.name}
    </span>`;
  }

  window.updateStats = function() {
    const d = tasks.filter(t=>t.done).length;
    const a = tasks.filter(t=>t.prio==='alta'&&!t.done).length;
    const n = tasks.length;
    document.getElementById('k-total').textContent = n;
    document.getElementById('k-done').textContent  = d;
    document.getElementById('k-alta').textContent  = a;
    document.getElementById('k-pct').textContent   = n ? Math.round(d/n*100)+'%' : '0%';
    document.getElementById('prog-fill').style.width = n ? (d/n*100)+'%' : '0%';
    document.getElementById('prog-txt').textContent  = `${d} de ${n} actividades completadas`;
  };

  window.render = function() {
    const root = document.getElementById('weeks-root');
    root.innerHTML = '';
    WK.forEach((wk, wi) => {
      const wt = tasks.filter(t=>t.week===wi);
      const dn = wt.filter(t=>t.done).length;
      const isOpen  = openWeeks.has(wi);
      const allDone = wt.length > 0 && dn === wt.length;
      const card = document.createElement('div');
      card.className = 'week-card';
      card.innerHTML = `
        <div class="week-head" onclick="toggleWeek(${wi})">
          <div class="wh-left">
            <div class="wk-num">${wi+1}</div>
            <div>
              <div class="wk-focus">${wk.focus}</div>
              <div class="wk-dates"><i class="fa-regular fa-calendar"></i> ${wk.label} · ${wk.dates}</div>
            </div>
          </div>
          <div class="wh-right">
            <span class="wpill ${allDone?'all-done':''}">${dn}/${wt.length} completadas</span>
            <i class="fa-solid fa-chevron-down wchev ${isOpen?'open':''}" id="wc-${wi}"></i>
          </div>
        </div>
        <div class="week-body ${isOpen?'open':''}" id="wb-${wi}">
          ${wt.length===0
            ? '<div class="empty-row"><i class="fa-regular fa-inbox"></i> Sin actividades esta semana</div>'
            : `<div class="tbl-hdr">
                <span></span>
                <span>Actividad y proyecto</span>
                <span class="tc">Prioridad</span>
                <span class="tc">Inicio</span>
                <span class="tc">Fin</span>
                <span></span>
               </div>
               ${wt.map(t=>`
               <div class="trow ${t.done?'done-row':''}">
                 <div class="tc">
                   <div class="chkbox ${t.done?'on':''}" onclick="toggleDone(${t.id})">
                     <i class="fa-solid fa-check"></i>
                   </div>
                 </div>
                 <div>
                   <div class="tname ${t.done?'striked':''}">${t.text}</div>
                   ${projBadge(t.proj)}
                 </div>
                 <div class="tc">
                   <select class="psel ${pcls(t.prio)}" onchange="setPrio(${t.id},this.value)">
                     <option value="alta"  ${t.prio==='alta' ?'selected':''}>🔴 Alta</option>
                     <option value="media" ${t.prio==='media'?'selected':''}>🟡 Media</option>
                     <option value="baja"  ${t.prio==='baja' ?'selected':''}>🟢 Baja</option>
                   </select>
                 </div>
                 <div class="tc"><input type="date" class="din" value="${t.start}" onchange="setDate(${t.id},'start',this.value)"></div>
                 <div class="tc"><input type="date" class="din" value="${t.end}"   onchange="setDate(${t.id},'end',  this.value)"></div>
                 <div class="tc">
                   <button class="delbtn" onclick="delTask(${t.id})" title="Eliminar">
                     <i class="fa-solid fa-trash-can"></i>
                   </button>
                 </div>
               </div>`).join('')}`
          }
          <div class="add-row">
            <i class="fa-solid fa-plus" style="font-size:12px;color:var(--t3)"></i>
            <input class="add-in" id="ai-${wi}" placeholder="Nueva actividad..."
              onkeydown="if(event.key==='Enter'){addTask(${wi},this.value,document.getElementById('ap-${wi}').value);this.value=''}">
            <select class="add-ps" id="ap-${wi}">
              ${PM.map((p,i)=>`<option value="${i}">${p.name}</option>`).join('')}
            </select>
            <button class="add-btn"
              onclick="addTask(${wi},document.getElementById('ai-${wi}').value,document.getElementById('ap-${wi}').value);document.getElementById('ai-${wi}').value=''">
              <i class="fa-solid fa-plus"></i> Agregar
            </button>
          </div>
        </div>`;
      root.appendChild(card);
    });
  };

  // Construir leyenda
  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('legend').innerHTML =
      PM.map(p=>`<span class="leg"><span class="ldot" style="background:${p.dot}"></span>${p.name}</span>`).join('');
  });
</script>

<style>
  :root {
    --bg:   #F5F4F0; --card: #FFFFFF; --sec: #F8F7F4; --head: #EFEDE8;
    --b1:   #E0DDD6; --b2:   #D0CEC7; --b3:   #C0BEB7;
    --t1:   #1A1916; --t2:   #6B6860; --t3:   #9E9C96;
    --acc:  #1D9E75; --acc2: #5DCAA5; --acc3: #E1F5EE;
    --r-md: 10px; --r-lg: 14px; --r-xl: 18px;
    --ff:   'DM Sans', system-ui, sans-serif;
    --fm:   'DM Mono', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131210; --card: #1C1B19; --sec: #232220; --head: #282724;
      --b1: #2E2D2A; --b2: #3A3835; --b3: #484643;
      --t1: #F0EDE6; --t2: #A09D96; --t3: #6B6860;
      --acc3: #04342C;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--ff); background: var(--bg); color: var(--t1); min-height: 100vh; }

  /* ── TOPBAR ── */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--card); border-bottom: 1px solid var(--b1);
    padding: 1rem 1.75rem;
    display: flex; align-items: center; justify-content: space-between;
    gap: 1rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .topbar-left h1 { font-size: 17px; font-weight: 600; letter-spacing: -.3px; }
  .topbar-left p  { font-family: var(--fm); font-size: 11px; color: var(--t3); margin-top: 2px; }
  .topbar-right   { display: flex; align-items: center; gap: 10px; }
  #save-status    { font-family: var(--fm); font-size: 12px; display: flex; align-items: center; gap: 5px; }
  .save-btn {
    background: var(--acc); color: #fff; border: none;
    padding: 8px 18px; border-radius: var(--r-md); font-size: 13px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; gap: 7px;
    transition: opacity .15s;
  }
  .save-btn:hover { opacity: .88; }

  /* ── CONTENT ── */
  .content { max-width: 980px; margin: 0 auto; padding: 1.5rem 1.75rem 3rem; }

  /* ── KPI STRIP ── */
  .kpi-strip { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 1rem; }
  .kpi {
    background: var(--card); border: 1px solid var(--b1); border-radius: var(--r-lg);
    padding: 13px 15px; display: flex; align-items: center; gap: 11px;
  }
  .ki { width: 38px; height: 38px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .ki.tl { background: #E1F5EE; color: #0F6E56; } .ki.gn { background: #EAF3DE; color: #3B6D11; }
  .ki.rd { background: #FCEBEB; color: #A32D2D; } .ki.bl { background: #E6F1FB; color: #185FA5; }
  @media (prefers-color-scheme: dark) {
    .ki.tl { background: #04342C; color: #5DCAA5; } .ki.gn { background: #173404; color: #97C459; }
    .ki.rd { background: #501313; color: #F09595; } .ki.bl { background: #042C53; color: #85B7EB; }
  }
  .kn { font-size: 22px; font-weight: 700; line-height: 1; }
  .kl { font-family: var(--fm); font-size: 10px; color: var(--t3); margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }

  /* ── PROGRESS ── */
  .prog-card {
    background: var(--card); border: 1px solid var(--b1); border-radius: var(--r-lg);
    padding: 13px 17px; margin-bottom: 1rem;
  }
  .prog-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--t2); margin-bottom: 9px; }
  .prog-pct  { font-family: var(--fm); font-weight: 600; color: var(--acc); }
  .prog-trk  { height: 7px; background: var(--b1); border-radius: 4px; overflow: hidden; }
  .prog-fill { height: 100%; background: linear-gradient(90deg, var(--acc), var(--acc2)); border-radius: 4px; transition: width .5s ease; }

  /* ── LEGEND ── */
  #legend { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 1.25rem; }
  .leg { display: flex; align-items: center; gap: 5px; background: var(--card); border: 1px solid var(--b1); border-radius: 20px; padding: 3px 10px; font-size: 11px; color: var(--t2); }
  .ldot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  /* ── WEEK CARD ── */
  .week-card {
    background: var(--card); border: 1px solid var(--b1); border-radius: var(--r-xl);
    overflow: hidden; margin-bottom: 13px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  .week-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; background: var(--head);
    border-bottom: 1px solid var(--b1); cursor: pointer; user-select: none;
    transition: background .12s;
  }
  .week-head:hover { background: var(--sec); }
  .wh-left  { display: flex; align-items: center; gap: 13px; }
  .wk-num   { width: 38px; height: 38px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--b1); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: var(--acc); flex-shrink: 0; }
  .wk-focus { font-size: 14px; font-weight: 600; }
  .wk-dates { font-family: var(--fm); font-size: 10px; color: var(--t3); margin-top: 3px; text-transform: uppercase; letter-spacing: .05em; }
  .wk-dates i { font-size: 11px; margin-right: 3px; }
  .wh-right { display: flex; align-items: center; gap: 11px; }
  .wpill    { font-family: var(--fm); font-size: 11px; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--b1); color: var(--t3); background: var(--card); }
  .wpill.all-done { background: #EAF3DE; color: #27500A; border-color: #97C459; }
  @media (prefers-color-scheme: dark) { .wpill.all-done { background: #173404; color: #C0DD97; border-color: #3B6D11; } }
  .wchev { font-size: 13px; color: var(--t3); transition: transform .2s; }
  .wchev.open { transform: rotate(180deg); }

  /* ── WEEK BODY ── */
  .week-body { display: none; }
  .week-body.open { display: block; }

  /* ── TABLE ── */
  .tbl-hdr {
    display: grid; grid-template-columns: 44px 1fr 114px 106px 106px 44px;
    gap: 8px; padding: 7px 20px; background: var(--sec); border-bottom: 1px solid var(--b1);
  }
  .tbl-hdr span { font-family: var(--fm); font-size: 10px; font-weight: 500; color: var(--t3); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; }
  .trow {
    display: grid; grid-template-columns: 44px 1fr 114px 106px 106px 44px;
    gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--b1);
    align-items: center; transition: background .1s;
  }
  .trow:last-of-type { border-bottom: none; }
  .trow:hover { background: var(--sec); }
  .trow.done-row { opacity: .5; }
  .tc { display: flex; align-items: center; justify-content: center; }
  .tname { font-size: 13px; line-height: 1.4; }
  .striked { text-decoration: line-through; }
  .proj-badge { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; padding: 2px 8px; border-radius: 20px; font-size: 10px; border: 1px solid transparent; }
  .pd { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  /* checkbox */
  .chkbox { width: 23px; height: 23px; border-radius: 7px; border: 1.5px solid var(--b2); cursor: pointer; display: flex; align-items: center; justify-content: center; background: var(--card); transition: all .15s; }
  .chkbox i { font-size: 11px; color: #fff; display: none; }
  .chkbox.on { background: var(--acc); border-color: var(--acc); }
  .chkbox.on i { display: block; }

  /* priority */
  .psel { width: 100%; padding: 5px 6px; border-radius: var(--r-md); font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid; appearance: none; outline: none; text-align: center; }
  .p-alta  { background: #FCEBEB; color: #A32D2D; border-color: #F09595; }
  .p-media { background: #FAEEDA; color: #7A4610; border-color: #EF9F27; }
  .p-baja  { background: #EAF3DE; color: #27500A; border-color: #97C459; }
  @media (prefers-color-scheme: dark) {
    .p-alta  { background: #501313; color: #F7C1C1; border-color: #A32D2D; }
    .p-media { background: #412402; color: #FAC775; border-color: #854F0B; }
    .p-baja  { background: #173404; color: #C0DD97; border-color: #3B6D11; }
  }

  /* date */
  .din { width: 100%; padding: 5px 6px; border: 1px solid var(--b1); border-radius: var(--r-md); font-family: var(--fm); font-size: 11px; background: var(--card); color: var(--t1); cursor: pointer; outline: none; }
  .din:hover { border-color: var(--b2); }
  .din:focus { border-color: var(--acc); }

  /* delete */
  .delbtn { width: 28px; height: 28px; border: 1px solid var(--b1); border-radius: var(--r-md); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--t3); transition: all .15s; }
  .delbtn:hover { border-color: #F09595; color: #A32D2D; background: #FCEBEB; }

  /* add row */
  .add-row { display: flex; gap: 8px; align-items: center; padding: 11px 20px; background: var(--sec); border-top: 1px dashed var(--b1); }
  .add-in  { flex: 1; padding: 7px 10px; border: 1px solid var(--b1); border-radius: var(--r-md); font-size: 12px; background: var(--card); color: var(--t1); outline: none; font-family: var(--ff); }
  .add-in:focus { border-color: var(--acc); }
  .add-ps  { padding: 7px 8px; border: 1px solid var(--b1); border-radius: var(--r-md); font-size: 11px; background: var(--card); color: var(--t1); cursor: pointer; outline: none; width: 140px; }
  .add-btn { padding: 7px 14px; border: 1px solid var(--b1); border-radius: var(--r-md); font-size: 12px; font-weight: 500; cursor: pointer; background: var(--card); color: var(--t2); display: flex; align-items: center; gap: 5px; transition: all .15s; white-space: nowrap; }
  .add-btn:hover { border-color: var(--acc); color: var(--t1); background: var(--acc3); }

  /* empty */
  .empty-row { padding: 24px; text-align: center; font-size: 12px; color: var(--t3); font-family: var(--fm); }
  .empty-row i { font-size: 20px; display: block; margin-bottom: 5px; }

  /* Notice banner */
  .firebase-notice {
    background: #FFF9E6; border: 1px solid #EF9F27; border-radius: var(--r-lg);
    padding: 12px 16px; margin-bottom: 1rem; font-size: 12px; color: #633806;
    display: flex; align-items: flex-start; gap: 10px; line-height: 1.6;
  }
  .firebase-notice i { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
  .firebase-notice strong { font-weight: 600; display: block; margin-bottom: 2px; }
  @media (prefers-color-scheme: dark) {
    .firebase-notice { background: #2D1F00; border-color: #854F0B; color: #FAC775; }
  }

  @media (max-width: 640px) {
    .topbar { padding: .875rem 1rem; }
    .content { padding: 1rem 1rem 2rem; }
    .kpi-strip { grid-template-columns: repeat(2,1fr); }
    .tbl-hdr, .trow { grid-template-columns: 36px 1fr 90px 90px 90px 36px; gap: 5px; padding: 9px 14px; }
  }
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="topbar-left">
    <h1>Cronograma ágil — Pendientes Oscar</h1>
    <p>Colaborativo en tiempo real · 5 semanas · 6 proyectos</p>

  <div class="topbar-right">

<div class="content">

    </div>

  <!-- KPIs -->
  <div class="kpi-strip">

</div>
